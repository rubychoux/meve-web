<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>MEVE OS로 이동해요</title></head>
<body><p>운영 관리가 MEVE OS로 통합됐어요. <a id="target" href="/os/#/app/admin">통합 관리 열기</a></p>
<script>
(function(){
  const source=new URLSearchParams(location.search), query=new URLSearchParams();
  const user=source.get('user');
  if(user && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(user)) query.set('user',user);
  const tab=source.get('tab');if(['waitlist','beta','instagram'].includes(tab)) query.set('tab',tab);
  const target='/os/#/app/admin'+(query.size?'?'+query.toString():'');
  document.getElementById('target').href=target;
  try{sessionStorage.removeItem('mv-admin-pass')}catch(e){}
  location.replace(target);
})();
</script></body></html>
