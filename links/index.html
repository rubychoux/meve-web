<style>
/* ============================================================
   MEVE — Links · airy pastel glass, no bevels, no gloom
   ============================================================ */
:root{
  --ink:#221721;
  --rose:#B8506B;
  --rose-deep:#8E3A50;
  --muted:#95848D;
  --serif:'Cormorant Garamond',serif;
  --sans:'Jost','Pretendard Variable',Pretendard,sans-serif;
  --kr:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  --ease:cubic-bezier(.19,.6,.22,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(85% 55% at 10% 4%, rgba(248,199,219,.75), transparent 60%),
    radial-gradient(75% 50% at 92% 16%, rgba(215,210,244,.6), transparent 62%),
    radial-gradient(70% 45% at 20% 60%, rgba(250,214,206,.5), transparent 60%),
    radial-gradient(85% 55% at 55% 108%, rgba(247,205,214,.7), transparent 64%),
    #FBF2F4;
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--kr);line-height:1.7;letter-spacing:-.008em;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

.page{
  min-height:100%;
  width:min(460px,100%);
  margin-inline:auto;
  padding:calc(clamp(3rem,8vh,4.6rem) + env(safe-area-inset-top)) clamp(1.3rem,5.5vw,1.9rem) calc(2.2rem + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;
}

/* ---------- masthead ---------- */
.mast{text-align:center}
.mast img{width:min(144px,39vw);margin-inline:auto}
.date{
  margin-top:1.2rem;
  font-family:var(--sans);font-size:.63rem;font-weight:400;letter-spacing:.12em;color:#7A6570;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.date i{font-style:normal;color:var(--rose)}
.thesis{
  margin-top:1.5rem;text-align:center;
  font-weight:300;font-size:.8rem;color:#9A8590;line-height:1.75;letter-spacing:-.01em;
}
.thesis b{
  display:block;margin-top:.05rem;
  font-weight:500;font-size:.92rem;color:#5C4450;
}
.thesis b em{font-style:normal;color:var(--rose-deep)}

/* ---------- cards: modern frosted, zero bevel ---------- */
.links{width:100%;margin-top:2rem;display:grid;gap:.65rem}
.lk{
  display:flex;align-items:center;gap:.85rem;
  padding:.85rem 1.05rem .85rem 1.15rem;
  border-radius:18px;
  background:rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 8px 28px -14px rgba(148,90,116,.14);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .35s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.lk:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.72);
  box-shadow:0 16px 42px -16px rgba(148,90,116,.24);
}
.lk:active{transform:scale(.985)}
.lk:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.lk .no{
  font-family:var(--serif);font-style:italic;font-size:.82rem;color:#C29AAB;
  width:1.3rem;flex:none;text-align:center;
}
.lk .tx{flex:1;min-width:0}
.lk .tx b{
  display:block;font-weight:500;font-size:.92rem;letter-spacing:-.015em;color:#3E2C37;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lk .tx i{
  display:block;font-style:normal;
  font-size:.7rem;font-weight:300;color:var(--muted);margin-top:.02rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lk .ar{
  flex:none;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(184,80,107,.06);
  color:#B18A9B;
  transition:background .35s,transform .35s var(--ease),color .35s;
}
.lk .ar svg{width:10px;height:10px;display:block}
.lk:hover .ar{background:rgba(184,80,107,.13);color:var(--rose-deep);transform:translate(2px,-2px)}

/* primary — fresh pale pink, dark type (reference grammar) */
.lk.primary{
  background:linear-gradient(135deg,#FBDDE7 0%,#F5C3D2 100%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 14px 36px -14px rgba(214,130,160,.35);
}
.lk.primary:hover{
  background:linear-gradient(135deg,#FCE3EB 0%,#F7CBD8 100%);
  box-shadow:0 18px 44px -16px rgba(214,130,160,.45);
}
.lk.primary .no{color:var(--rose-deep)}
.lk.primary .tx b{color:#7C3450;font-weight:600}
.lk.primary .tx i{color:#A96C82}
.lk.primary .ar{background:rgba(255,255,255,.65);color:var(--rose-deep)}
.lk.primary:hover .ar{background:rgba(255,255,255,.85);color:var(--rose-deep)}

/* ---------- foot ---------- */
.foot{margin-top:auto;padding-top:2.6rem;text-align:center}
.foot .star{color:#C7A76C;font-size:.56rem;letter-spacing:.5em;padding-left:.5em}
.foot p{
  margin-top:.75rem;
  font-family:var(--sans);font-size:.57rem;letter-spacing:.2em;text-transform:uppercase;color:#A998A2;line-height:2;
  color:#A796A0;
}
.foot a{color:var(--rose-deep)}

.up{opacity:0;transform:translateY(10px);animation:up .8s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.16s}
.d4{animation-delay:.21s}.d5{animation-delay:.26s}.d6{animation-delay:.31s}
.d7{animation-delay:.36s}.d8{animation-delay:.42s}
@media(prefers-reduced-motion:reduce){.up{opacity:1;transform:none;animation:none}}
</style>
</head>
