<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MEVE · Links</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<meta name="description" content="MEVE. 출시 알림 · 하우스 · 마스터마인드 · 파트너십.">
<meta name="theme-color" content="#FBF7F5">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   MEVE — Links · a couture programme, not a link tree
   paper, hairlines, type. no cards.
   ============================================================ */
:root{
  --paper:#FBF7F5;
  --ink:#1A1216;
  --rose:#B8506B;
  --rose-deep:#8E3A50;
  --muted:#8A7C82;
  --hairline:rgba(26,18,22,.16);
  --serif:'Cormorant Garamond',serif;
  --sans:'Jost','Pretendard Variable',Pretendard,sans-serif;
  --kr:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  --ease:cubic-bezier(.19,.6,.22,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--kr);line-height:1.7;letter-spacing:-.008em;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

.page{
  min-height:100%;
  width:min(480px,100%);
  margin-inline:auto;
  padding:calc(clamp(3.2rem,9vh,5rem) + env(safe-area-inset-top)) clamp(1.4rem,6vw,2rem) calc(2.4rem + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
}

/* ---------- masthead ---------- */
.mast{text-align:center}
.mast img{width:min(210px,56vw);margin-inline:auto}
.mast .date{
  margin-top:1.6rem;
  font-family:var(--sans);font-size:.62rem;letter-spacing:.34em;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:1rem;
}
.mast .date::before,.mast .date::after{content:"";height:1px;width:34px;background:var(--hairline)}
.thesis{
  margin-top:2rem;text-align:center;
  font-weight:300;font-size:.95rem;color:#4E434A;line-height:1.8;
}
.thesis b{font-weight:600;color:var(--ink)}

/* ---------- programme ---------- */
.prog{margin-top:2.6rem;border-top:1px solid var(--ink)}
.row{
  display:flex;align-items:baseline;gap:1rem;
  padding:1.15rem .1rem 1.2rem;
  border-bottom:1px solid var(--hairline);
  transition:padding .35s var(--ease);
}
.row:active{opacity:.6}
.row .no{
  font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--rose);
  width:1.7rem;flex:none;
}
.row .tx{flex:1;min-width:0}
.row .tx b{
  display:block;
  font-family:var(--kr);font-weight:600;font-size:1.06rem;letter-spacing:-.02em;
  transition:color .3s;
}
.row .tx i{
  display:block;font-style:normal;
  font-size:.78rem;font-weight:300;color:var(--muted);margin-top:.1rem;
}
.row .ar{
  font-family:var(--serif);font-size:1.1rem;color:#C9BCC1;flex:none;
  transition:transform .35s var(--ease),color .3s;
}
@media(hover:hover){
  .row:hover{padding-left:.55rem}
  .row:hover .tx b{color:var(--rose-deep)}
  .row:hover .ar{transform:translateX(4px);color:var(--rose)}
}
/* the first item is the invitation — rose, slightly larger, no box needed */
.row.first .tx b{font-size:1.16rem;color:var(--rose-deep)}
.row.first .no{color:var(--rose-deep)}

/* ---------- foot ---------- */
.foot{
  margin-top:auto;padding-top:2.8rem;text-align:center;
}
.foot .star{color:#C7A76C;font-size:.58rem;letter-spacing:.5em;padding-left:.5em}
.foot p{
  margin-top:.8rem;
  font-family:var(--sans);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:#A2949B;line-height:2;
}
.foot a{color:var(--rose-deep)}

/* entrance: quiet rise, no theatrics */
.up{opacity:0;transform:translateY(10px);animation:up .8s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.16s}
.d4{animation-delay:.2s}.d5{animation-delay:.24s}.d6{animation-delay:.28s}
.d7{animation-delay:.32s}.d8{animation-delay:.38s}
@media(prefers-reduced-motion:reduce){.up{opacity:1;transform:none;animation:none}}
</style>
</head>
<body>

<main class="page">
  <header class="mast up">
    <a href="https://meve.beauty" aria-label="MEVE 홈">

    </a>
    <p class="date up d1">앱 · 2026년 7월 출시 · 서울</p>
  </header>

  <p class="thesis up d2">감에 기대던 아름다움의 시대는 끝.<br><b>나의 최상은 데이터가 알고 있어요.</b></p>

  <nav class="prog up d3" aria-label="MEVE 링크">
    <a class="row first up d3" href="https://meve.beauty/#waitlist">
      <span class="no" aria-hidden="true">i.</span>
      <span class="tx"><b>출시 알림 신청</b><i>얼리 액세스 · 선착순 초대</i></span>
      <span class="ar" aria-hidden="true">→</span>
    </a>
    <a class="row up d4" href="https://meve.beauty">
      <span class="no" aria-hidden="true">ii.</span>
      <span class="tx"><b>미브 하우스</b><i>브랜드 필름 · 시스템 · 뷰티 DNA</i></span>
      <span class="ar" aria-hidden="true">→</span>
    </a>
    <a class="row up d5" href="https://meve.beauty/#mastermind">
      <span class="no" aria-hidden="true">iii.</span>
      <span class="tx"><b>마스터마인드</b><i>8주 아카데미 · 1기 모집</i></span>
      <span class="ar" aria-hidden="true">→</span>
    </a>
    <a class="row up d6" href="https://meve.beauty/partners">
      <span class="no" aria-hidden="true">iv.</span>
      <span class="tx"><b>파트너십</b><i>클리닉 · 브랜드 · 아티스트 · 리테일</i></span>
      <span class="ar" aria-hidden="true">→</span>
    </a>
    <a class="row up d7" href="mailto:ruby@meve.beauty">
      <span class="no" aria-hidden="true">v.</span>
      <span class="tx"><b>문의</b><i>ruby@meve.beauty</i></span>
      <span class="ar" aria-hidden="true">→</span>
    </a>
  </nav>

  <footer class="foot up d8">
    <span class="star" aria-hidden="true">✦</span>
    <p>© 2026 미브 (Meve) · 사업자등록번호 310-49-01303<br>
    <a href="https://meve.beauty">meve.beauty</a> · <a href="https://meve.beauty/privacy">개인정보처리방침</a></p>
  </footer>
</main>

</body>
</html>
