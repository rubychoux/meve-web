<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   MEVE — Links · airy pastel glass, no bevels, no gloom
   ============================================================ */
:root{
  --ink:#221721;
  --rose:#B8506B;
  --rose-deep:#8E3A50;
  --muted:#95848D;
  --serif:'Cormorant Garamond',serif;
  --sans:'Jost','Pretendard Variable',Pretendard,sans-serif;
  --kr:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  --ease:cubic-bezier(.19,.6,.22,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(90% 60% at 15% 8%, rgba(240,196,214,.55), transparent 60%),
    radial-gradient(80% 55% at 88% 22%, rgba(206,190,232,.42), transparent 62%),
    radial-gradient(90% 60% at 50% 105%, rgba(245,214,206,.5), transparent 65%),
    linear-gradient(170deg,#FDFAFA 0%, #F8EFF3 55%, #F5ECF3 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--kr);line-height:1.7;letter-spacing:-.008em;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

.page{
  min-height:100%;
  width:min(460px,100%);
  margin-inline:auto;
  padding:calc(clamp(3rem,8vh,4.6rem) + env(safe-area-inset-top)) clamp(1.3rem,5.5vw,1.9rem) calc(2.2rem + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;
}

/* ---------- masthead ---------- */
.mast{text-align:center}
.mast img{width:min(200px,54vw);margin-inline:auto}
.date{
  margin-top:1.5rem;
  font-family:var(--sans);font-size:.62rem;letter-spacing:.32em;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:.9rem;
}
.date i{font-style:normal;color:var(--rose)}
.thesis{
  margin-top:1.7rem;text-align:center;
  font-weight:300;font-size:.94rem;color:#5A4A53;line-height:1.8;
}
.thesis b{font-weight:600;color:var(--ink)}

/* ---------- cards: modern frosted, zero bevel ---------- */
.links{width:100%;margin-top:2.3rem;display:grid;gap:.8rem}
.lk{
  display:flex;align-items:center;gap:1rem;
  padding:1.05rem 1.3rem;
  border-radius:22px;
  background:rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 10px 34px -14px rgba(148,90,116,.16);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .35s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.lk:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.72);
  box-shadow:0 16px 42px -16px rgba(148,90,116,.24);
}
.lk:active{transform:scale(.985)}
.lk:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.lk .no{
  font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--rose);
  width:1.5rem;flex:none;text-align:center;
}
.lk .tx{flex:1;min-width:0}
.lk .tx b{
  display:block;font-weight:600;font-size:1.02rem;letter-spacing:-.02em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lk .tx i{
  display:block;font-style:normal;
  font-size:.76rem;font-weight:300;color:var(--muted);margin-top:.05rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lk .ar{
  flex:none;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(184,80,107,.08);
  color:var(--rose);font-family:var(--serif);font-size:1rem;
  transition:background .35s,transform .35s var(--ease),color .35s;
}
.lk:hover .ar{background:rgba(184,80,107,.14);transform:translateX(3px)}

/* primary — soft rose fill, flat and modern */
.lk.primary{
  background:linear-gradient(135deg,#EF9FBB 0%,#D66E92 100%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 14px 38px -14px rgba(190,90,125,.45);
}
.lk.primary:hover{
  background:linear-gradient(135deg,#F0A6C0 0%,#DB7597 100%);
  box-shadow:0 18px 46px -16px rgba(190,90,125,.55);
}
.lk.primary .no{color:rgba(255,255,255,.9)}
.lk.primary .tx b{color:#fff}
.lk.primary .tx i{color:rgba(255,244,248,.9)}
.lk.primary .ar{background:rgba(255,255,255,.22);color:#fff}
.lk.primary:hover .ar{background:rgba(255,255,255,.3)}

/* ---------- foot ---------- */
.foot{margin-top:auto;padding-top:2.6rem;text-align:center}
.foot .star{color:#C7A76C;font-size:.56rem;letter-spacing:.5em;padding-left:.5em}
.foot p{
  margin-top:.75rem;
  font-family:var(--sans);font-size:.57rem;letter-spacing:.2em;text-transform:uppercase;color:#A998A2;line-height:2;
  color:#A796A0;
}
.foot a{color:var(--rose-deep)}

.up{opacity:0;transform:translateY(10px);animation:up .8s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.16s}
.d4{animation-delay:.21s}.d5{animation-delay:.26s}.d6{animation-delay:.31s}
.d7{animation-delay:.36s}.d8{animation-delay:.42s}
@media(prefers-reduced-motion:reduce){.up{opacity:1;transform:none;animation:none}}
</style>
</head>

</body>
